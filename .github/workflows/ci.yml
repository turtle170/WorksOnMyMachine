name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Unit tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: End-to-end pipeline
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXT=".exe"; fi
          W="$PWD/target/release/womm$EXT"
          PY=python3; if [[ "$RUNNER_OS" == "Windows" ]] || ! command -v python3 >/dev/null; then PY=python; fi
          mkdir e2e && cd e2e
          export WOMM_HOME="$PWD/home" WOMM_FAST=1
          cp ../examples/synergy.womm .

          # parse -> build -> parsy-builder
          "$W" parse synergy.womm -O2 | tee parse.txt
          grep -q "warning\[W" parse.txt
          test "$(ls synergy.kludged | wc -l | tr -d ' ')" = "64"
          "$W" build synergy.kludged | tee build.txt
          grep -q "Verified\|garbage collected" build.txt
          test ! -e synergy.kludged/chain.kludged
          test ! -e synergy.kludged/nonet.kludged
          "$W" parsy-builder synergy.womm.md

          # the executable
          "./synergy$EXT" | tee out.txt
          grep -qi "program complete" out.txt
          grep -q "verdict:" out.txt
          "./synergy$EXT" | diff - out.txt
          SIG="$("./synergy$EXT" --womm-signature | tr -d '\r')"
          HEX="$(sed -n '/chain:begin/,/chain:end/p;/extra:begin/,/extra:end/p' synergy.womm.md | grep -E '^[0-9a-f]+$' | tr -d '\n')"
          test "$HEX" = "$SIG"
          test "$("./synergy$EXT" --womm-disasm | wc -l | tr -d ' ')" = "$(( ${#SIG} / 2 ))"
          "./synergy$EXT" --womm-mood

          # determinism
          cp synergy.womm.md first.md
          "$W" build -W no synergy.kludged
          cmp first.md synergy.womm.md
          rm first.md

          # visualise: the Python must reproduce NoNet's extra hash exactly
          "$W" visualise synergy.womm.md
          EXTRA="$(sed -n '/extra:begin/,/extra:end/p' synergy.womm.md | grep -E '^[0-9a-f]+$' | tr -d '\n')"
          test "$("$PY" synergy.nonet.py | tr -d '\r')" = "$EXTRA"

          # packages: no list command, decline means no install
          "$W" ask will this work | tee ask.txt
          grep -qx "No." ask.txt
          "$W" pack-store ../packages "$WOMM_HOME/packages.tar"
          set +e; echo n | "$W" ship nonet > ship.txt; code=$?; set -e
          test "$code" = "1"
          grep -q "No access, though it worked on my machine." ship.txt
          test ! -e "$WOMM_HOME/womm/nonet"
          echo y | "$W" ship nonet
          test -e "$WOMM_HOME/womm/nonet/manifest.toml"
          "$W" ask will this work on my machine | grep >/dev/null "confidence"
          "$W" train --epochs 2 | grep >/dev/null "no-rate"
          "$W" visualise synergy.womm.md --run | grep >/dev/null "NoNet is real"

          # the rest of the hidden layer
          printf 'Make it pop\nSynergise the backlog\n' > pop.womm
          "$W" parse pop.womm && "$W" build pop.kludged && "$W" parsy-builder pop.womm.md
          "$W" duel "synergy$EXT" "pop$EXT" | grep >/dev/null "works on MY machine\|draw"
          "$W" works-on-my-machine --prove > cert.txt
          "$W" works-on-my-machine --verify cert.txt | grep >/dev/null VALID
          "$W" blame synergy.womm | grep >/dev/null "the machine is innocent"
          "$W" standup
          "$W" why

          # cleanup
          "$W" augh
          test ! -e synergy.kludged
          test ! -e synergy.womm.md
          test -e synergy.womm

      - name: Windows installer compiles
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp target/release/womm.exe README.md LICENSE stage/
          if ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
          fi
          makensis -DVERSION=0.0.0 -DSRC="$(cygpath -w "$PWD/stage")" \
            -DOUT="$(cygpath -w "$PWD/womm-ci-setup.exe")" installer/windows/womm.nsi
          test -s womm-ci-setup.exe
          powershell -NoProfile -Command "(Get-Item target/release/womm.exe).VersionInfo | Format-List ProductName,ProductVersion,FileDescription"
