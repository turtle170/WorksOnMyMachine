name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: Package store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packages.tar
        run: |
          cargo build --release
          ./target/release/womm pack-store packages packages.tar
          WOMM_FAST=1 ./target/release/womm why --release > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages.tar
            release-notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: packages
    runs-on: ${{ matrix.os }}
    env:
      # Windows binaries are signed by SignPath Foundation once the project's
      # SignPath settings exist. Until then, releases are built unsigned.
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ---- SignPath: sign womm.exe before it goes anywhere ----
      - name: Upload unsigned womm.exe
        if: env.SIGNPATH == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-womm-exe
          path: target/${{ matrix.target }}/release/womm.exe
      - name: Sign womm.exe (SignPath Foundation)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'womm' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: womm-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-exe
      - name: Use the signed womm.exe
        if: env.SIGNPATH == 'true'
        shell: bash
        run: cp signed-exe/womm.exe "target/${{ matrix.target }}/release/womm.exe"

      - name: Portable archive
        shell: bash
        run: |
          set -euo pipefail
          name="womm-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE packages.tar "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/womm.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/womm" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      - name: Windows installer (NSIS .exe, installs to %AppData%\Womm)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$PWD/stage"
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/release/womm.exe README.md LICENSE packages.tar "$stage/"
          ./scripts/fetch-python.sh "${{ matrix.target }}" "$stage"
          if ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
          fi
          makensis -DVERSION="${GITHUB_REF_NAME#v}" -DSRC="$(cygpath -w "$stage")" \
            -DOUT="$(cygpath -w "$PWD/womm-${GITHUB_REF_NAME}-${{ matrix.target }}-setup.exe")" \
            installer/windows/womm.nsi

      # ---- SignPath: sign the installer too ----
      - name: Upload unsigned installer
        if: env.SIGNPATH == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-womm-setup
          path: womm-*-setup.exe
      - name: Sign the installer (SignPath Foundation)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'womm' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: womm-setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-setup
      - name: Use the signed installer
        if: env.SIGNPATH == 'true'
        shell: bash
        run: cp signed-setup/*-setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            womm-*.tar.gz
            womm-*.zip
            womm-*-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [packages, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/*-setup.exe dist/packages.tar \
            --repo "$GITHUB_REPOSITORY" \
            --title "womm $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
